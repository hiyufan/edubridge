services:
  jww:
    build: .
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET required}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET required}
      - PORT=3000
      - JW_URL=https://jw.fzrjxy.com
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-http://localhost:5173}
      - SECURE_COOKIE=${SECURE_COOKIE:-false}
      - MONITOR_KEEPALIVE_INTERVAL=${MONITOR_KEEPALIVE_INTERVAL:-10m}
      - MONITOR_CHECK_INTERVAL=${MONITOR_CHECK_INTERVAL:-1h}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
